name: CSC325 CI CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the working local virtual environment.
  PYTHON_VERSION: '3.14'

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify Python
        run: python --version

  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install and verify dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Jobs have separate runners, so Test installs its own packages.
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run full test suite
        run: python manage.py test --verbosity 2

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Simulate deployment after passing tests
        run: |
          echo "DEPLOY SUCCESS: CSC325 app commit $GITHUB_SHA passed all tests."
          echo "### Deploy successful (simulation)" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This assignment uses an echo simulation; no public app is hosted." >> "$GITHUB_STEP_SUMMARY"
